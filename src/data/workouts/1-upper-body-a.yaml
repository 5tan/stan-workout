name: Mon - Upper Body A
description: "Required: kettlebells, dumbbells, bench."

plan:

  # --- Warm-up ---
  - include: warm-ups/warm-up-2.yaml

  # ===== MAIN CIRCUIT (3 ROUNDS) =====

  # --- Set 1 ---
  - &set1
    - step: { exercise_id: dumbbell-bench-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2xALL", weight: 2x19.5kg}
    - step: { exercise_id: rest, label: "take off S", duration_s: 50 }

    - step: { exercise_id: dumbbell-squeeze-bench-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5)", weight: 2x12kg}
    - step: { exercise_id: rest, label: "replace M with S", duration_s: 50 }

    - step: { exercise_id: dumbbell-bicep-curl, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: dumbbell-row, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg }
    - step: { exercise_id: rest, label: "take off 1xS", duration_s: 20 }

    - step: { exercise_id: dumbbell-shoulder-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+1x1.25)", weight: 2x13.25kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: push-ups-diamond, reps: { prep_s: 10, reps_num: 14, rep_duration_s: 3 } }
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: dumbbell-lateral-rises, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x2.5+2x1.25)", weight: 2x9.5kg}
    - step: { exercise_id: rest, duration_s: 50 }
    
  # --- Set 2 (repeat) ---
  - step: { exercise_id: rest, duration_s: 90 }
  - *set1

  # --- Set 3 (repeat) ---
  - step: { exercise_id: rest, duration_s: 90 }
  - *set1

  # --- Cooldown ---
  - step: { exercise_id: rest, duration_s: 30 }
  - step: { exercise_id: biceps-dynamic-stretch, duration_s: 25 }
  - step: { exercise_id: stretch-arm-wall, label: "R", duration_s: 25  }
  - step: { exercise_id: stretch-arm-wall, label: "L", image_flip: true, duration_s: 25  }
  - step: { exercise_id: stretch-bicep-wall, label: "R", duration_s: 25  }
  - step: { exercise_id: stretch-bicep-wall, label: "L", image_flip: true, duration_s: 25  }
  - step: { exercise_id: stretch-shoulders-static-wall, duration_s: 25 }

