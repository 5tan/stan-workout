name: Upper Body
description: "Required: dumbbells, bench."

plan:

  # --- Warm-up ---
  - include: warm-ups/warm-up-2.yaml

  # ===== MAIN =====

  - repeat: 3
    rest_s: 30
    steps: 
      - step: { exercise_id: dumbbell-bench-press, reps: { prep_s: 10, reps_num: 9, rep_duration_s: 4 }, label: "2xALL", weight: 2x19.5kg}
      - step: { exercise_id: dumbbell-lateral-rises-one-arm, reps: { prep_s: 10, reps_num: 12, rep_duration_s: 4 }, label: "alternating", weight: KB10kg}

  - step: { exercise_id: rest, duration_s: 70 }

  - repeat: 3
    rest_s: 30
    steps: 
      - step: { exercise_id: dumbbell-bicep-curl-to-shoulder-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 7 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg}
      #- step: { exercise_id: dumbbell-bench-fly, reps: { prep_s: 10, reps_num: 10, rep_duration_s: 4 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg}
      - step: { exercise_id: pushup-archer, reps: { prep_s: 10, reps_num: 4, rep_duration_s: 4 } }

  - step: { exercise_id: rest, duration_s: 50 }

  - repeat: 3
    rest_s: 30
    steps:   
      - step: { exercise_id: dumbbell-row-one-leg-stand, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 7 }, label: "2xALL", weight: 19.5kg}
      - step: { exercise_id: dumbbell-skull-crusher, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2.5+1.25)", weight: 2x9.5kg}

  # --- Cooldown ---
  - step: { exercise_id: rest, duration_s: 15 }
  - step: { exercise_id: stretch-arm-floor, label: "R", duration_s: 60  }
  - step: { exercise_id: stretch-arm-floor, label: "L", image_flip: true, duration_s: 60  }
  - step: { exercise_id: stretch-arm-bench, duration_s: 60 }

