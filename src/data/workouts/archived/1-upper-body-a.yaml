name: Mon - Upper Body A
description: "Required: kettlebells, dumbbells, bench."

plan:

  # --- Warm-up ---
  - include: warm-ups/warm-up-2.yaml

  # ===== MAIN CIRCUIT (3 ROUNDS) =====

  # --- Set 1 ---
  - &set1
    - step: { exercise_id: dumbbell-bench-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2xALL", weight: 2x19.5kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: dumbbell-row, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg }
    - step: { exercise_id: rest, duration_s: 20 }

    # take off M disks

    - step: { exercise_id: dumbbell-bench-fly, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5)", weight: 2x12kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: dumbbell-bicep-curl, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+2x1.25)", weight: 2x14.5kg}
    - step: { exercise_id: rest, duration_s: 50 }

    # take off 1 S disk

    - step: { exercise_id: dumbbell-shoulder-press, reps: { prep_s: 10, reps_num: 8, rep_duration_s: 4 }, label: "2x(b+2x5+1x1.25)", weight: 2x13.25kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: dumbbell-lateral-rises, reps: { prep_s: 10, reps_num: 9, rep_duration_s: 4 }, label: "hex", weight: 2x7.5kg}
    - step: { exercise_id: rest, duration_s: 50 }

    - step: { exercise_id: push-ups-diamond, reps: { prep_s: 10, reps_num: 14, rep_duration_s: 3 } }

  # --- Set 2 (repeat) ---
  - step: { exercise_id: rest, duration_s: 90 }
  - *set1

  # --- Set 3 (repeat) ---
  - step: { exercise_id: rest, duration_s: 90 }
  - *set1

  # --- Cooldown ---
  - step: { exercise_id: rest, duration_s: 15 }
  - step: { exercise_id: stretch-arm-wall, label: "R", duration_s: 60  }
  - step: { exercise_id: stretch-arm-wall, label: "L", image_flip: true, duration_s: 60  }
  - step: { exercise_id: stretch-shoulders-static-wall, duration_s: 60 }

